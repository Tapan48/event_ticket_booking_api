name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ticketing
          POSTGRES_USER: ticketing
          POSTGRES_PASSWORD: ci-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ticketing -d ticketing"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      SECRET_KEY: ci-only-placeholder-never-use-in-production-0123456789abcdef
      DATABASE_URL: postgres://ticketing:ci-test-only@localhost:5432/ticketing
      REDIS_URL: redis://localhost:6379/0
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python manage.py makemigrations --check --dry-run
      - run: pytest --cov --cov-fail-under=90
      - name: Validate production configuration and image
        run: |
          docker compose --env-file .env.prod.example -f docker-compose.prod.yml config --quiet
          docker build --target production -t ticket-booking-ci .
          docker run --rm ticket-booking-ci python -c "import os; from pathlib import Path; assert os.getuid() != 0; assert not Path('/app/.env').exists(); assert not Path('/app/.env.prod').exists(); assert Path('/app/staticfiles/staticfiles.json').exists()"

  proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and validate unprivileged HTTPS proxy
        run: |
          docker build -t ticket-booking-proxy-ci deploy/caddy
          docker run --rm --cap-drop ALL --security-opt no-new-privileges:true \
            -e PUBLIC_HOST=example.duckdns.org -e ACME_EMAIL=demo@example.com \
            -e DUCKDNS_API_TOKEN=validation-placeholder \
            ticket-booking-proxy-ci caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan full Git history with redacted output
        run: |
          docker run --rm -v "$PWD:/repo:ro" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --no-banner --log-opts=--all
